[package]
name = "baocr-ocr"
edition.workspace = true
version.workspace = true

[features]
# GPU inference through DirectML (docs/speed-research.md): off by default
directml = ["oar-ocr/directml"]
# TrOCR reading of a name label (docs/trocr-evaluation.md): evaluation only, off by default and not in the shipped build
trocr = []

[dependencies]
baocr-core.workspace = true
oar-ocr = "0.11"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "copy-dylibs"] }
image.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
baocr-names = { path = "../names" }
baocr-pixels = { path = "../pixels" }

[[example]]
name = "trocr_probe"
required-features = ["trocr"]
