name: release

# Builds the Windows add-on and publishes it as a GitHub Release.
# Push a tag v<version> (the version in scanner/Cargo.toml) or run it by hand with that tag name.
#
# Only tag pushes and manual runs trigger it: there is no pull_request trigger, so a fork pull request can neither run
# it nor receive secrets. Both jobs also refuse to run outside whyjp/ba_key_amas, and a manual run only from main or a v* tag.
# ADDON_SIGNING_KEY (a repository secret) is compiled into the shipped exe as BAOCR_ADDON_SIGNING_KEY. It is given to
# exactly two steps, the length check and the package build, both plain pwsh that run no third-party action.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, v<scanner/Cargo.toml version>. Created on the selected commit when it does not exist."
        required: true
        type: string

# No job gets more than read unless it says so. Only the publish job writes, and it runs no code from this repository.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  ASSET: ba-key-AMAS-${{ github.event.inputs.tag || github.ref_name }}-windows-x64.zip

jobs:
  build:
    if: github.repository == 'whyjp/ba_key_amas' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release contract (tag, version, download URL, protocol, migrations)
        run: ./scripts/release-check.ps1 -Tag $env:TAG

      - name: Signing key is set (length only, the value is never printed)
        env:
          BAOCR_ADDON_SIGNING_KEY: ${{ secrets.ADDON_SIGNING_KEY }}
        run: |
          $n = "$env:BAOCR_ADDON_SIGNING_KEY".Length
          if ($n -lt 16) { throw "secret ADDON_SIGNING_KEY is missing or shorter than 16 characters (length $n)" }
          "ADDON_SIGNING_KEY length $n"

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      # Not scanner/target: the shipped build embeds the signing key, and a cache would keep that build around.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('scanner/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Models and wikidb/wiki.db are committed seeds. The build downloads nothing from outside the repository.
      - name: Seed data (committed models and wiki.db)
        run: |
          Push-Location models
          sha256sum --check --strict SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw "models do not match models/SHA256SUMS" }
          Pop-Location
          python -I scripts/check_wikidb.py wikidb/wiki.db
          if ($LASTEXITCODE -ne 0) { throw "wiki.db check failed" }

      - name: Tests
        working-directory: scanner
        env:
          BAOCR_MODELS: ${{ github.workspace }}/models
        run: |
          cargo test --release --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed ($LASTEXITCODE)" }

      - name: Portable package, zip and SHA256SUMS (the only compile with the signing key)
        env:
          BAOCR_ADDON_SIGNING_KEY: ${{ secrets.ADDON_SIGNING_KEY }}
        run: |
          ./scripts/package-portable.ps1 -Out "$env:RUNNER_TEMP/pkg" -Zip "$env:GITHUB_WORKSPACE/dist/$env:ASSET"

      - name: Smoke test of the packaged exe (no secret in this step)
        run: |
          if ($env:BAOCR_ADDON_SIGNING_KEY) { throw "the signing key must not be in this step's environment" }
          $exe = "$env:RUNNER_TEMP/pkg/ba-key-AMAS.exe"
          # the exe has no console of its own (windowless), so PowerShell does not wait for it or read its output
          # through a pipe: run it with its output redirected to a file and wait.
          function Invoke-Exe($argument) {
            $out = Join-Path $env:RUNNER_TEMP "smoke-out.txt"
            $p = Start-Process -FilePath $exe -ArgumentList $argument -RedirectStandardOutput $out -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "$argument exited $($p.ExitCode)" }
            (Get-Content $out -Raw)
          }
          $v = (Invoke-Exe "--version").Trim()
          $v
          $want = "ba-key-AMAS " + $env:TAG.TrimStart("v")
          if ($v -ne $want) { throw "version output '$v', expected '$want'" }
          $info = Invoke-Exe "--build-info"
          $info
          if ($info -notmatch "(?m)^signed build: yes?$") { throw "the shipped exe carries no signing key" }
          (Invoke-Exe "--help") -split "`n" | Select-Object -First 5
          Get-Content "$env:GITHUB_WORKSPACE/dist/SHA256SUMS"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/${{ env.ASSET }}
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.repository == 'whyjp/ba_key_amas'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Verify the checksum, then create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          flags=(--title "ba-key-AMAS $TAG" --generate-notes --target "$GITHUB_SHA")
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" SHA256SUMS --clobber
          else
            gh release create "$TAG" "$ASSET" SHA256SUMS "${flags[@]}"
          fi
