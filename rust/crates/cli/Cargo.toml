[package]
name = "baocr"
edition.workspace = true
version.workspace = true

[[bin]]
name = "baocr"
path = "src/main.rs"

[dependencies]
baocr-core.workspace = true
baocr-extract = { path = "../extract" }
baocr-export = { path = "../export" }
baocr-ocr = { path = "../ocr" }
baocr-hcu = { path = "../hcu" }
baocr-overlay = { path = "../overlay" }
baocr-pipeline = { path = "../pipeline" }
chrono.workspace = true
ctrlc = "3"
anyhow.workspace = true
serde_json.workspace = true
image.workspace = true
clap = { version = "4", features = ["derive"] }
