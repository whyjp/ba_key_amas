[workspace]
resolver = "2"
members = ["crates/extract", "crates/core", "crates/names", "crates/pixels", "crates/equipment", "crates/export", "crates/ocr", "crates/cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
baocr-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
anyhow = "1"
regex = "1"
csv = "1"
sha1 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
